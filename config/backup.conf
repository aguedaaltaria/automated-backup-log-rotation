# ==============================================================================
# Archivo de configuración: backup.conf
# ==============================================================================

# Directorio que contiene los datos que queremos respaldar
DIRECTORIO_ORIGEN="./source_data"

# Directorio donde se guardarán los respaldos comprimidos
DIRECTORIO_DESTINO="./backups"

# Prefijo para nombrar el archivo resultante
PREFIJO_RESPALDO="respaldo_sistema"

# Patrón de archivos que NO queremos respaldar (por ejemplo, archivos temporales)
PATRON_EXCLUSION="*.tmp"